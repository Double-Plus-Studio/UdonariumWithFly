name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Lint and Type Check", "Unit Tests"]
    types: [completed]
    branches: [zh-TW]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify both Lint and Tests passed for this commit
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_run') {
              core.setOutput('ready', 'true');
              core.setOutput('sha', context.sha);
              return;
            }
            const sha = context.payload.workflow_run.head_sha;
            core.setOutput('sha', sha);
            const required = ['Lint and Type Check', 'Unit Tests'];

            for (const name of required) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
              });
              const run = data.workflow_runs
                .filter(r => r.name === name)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (!run || run.conclusion !== 'success') {
                console.log(`⏳ ${name} not yet passed — skipping deploy`);
                core.setOutput('ready', 'false');
                return;
              }
              console.log(`✓ ${name} passed`);
            }
            core.setOutput('ready', 'true');

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create config.yaml
        run: |
          cat > src/assets/config.yaml << EOF
          backend:
            mode: trystero
          trystero:
            firebase:
              apiKey: ${{ secrets.FIREBASE_API_KEY }}
              databaseURL: ${{ secrets.FIREBASE_DATABASE_URL }}
              projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
              appId: ${{ secrets.FIREBASE_APP_ID }}
          EOF

      - name: Build
        run: npm run build -- --base-href /

      - name: Push to Double-Plus-Studio.github.io
        run: |
          touch dist/udonarium/browser/.nojekyll
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/Double-Plus-Studio/Double-Plus-Studio.github.io.git pages-repo
          find pages-repo -maxdepth 1 ! -name '.git' ! -name 'pages-repo' -exec rm -rf {} +
          cp -r dist/udonarium/browser/. pages-repo/
          cd pages-repo
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from UdonariumWithFly@${{ needs.check.outputs.sha }}"
          git push
