name: Lint and Type Check

on:
  push:
    branches: [main, zh-TW, master]
  pull_request:
    branches: [main, zh-TW, master]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --format json --output-file lint-results.json || true
        continue-on-error: false

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

      - name: Upload lint results (if available)
        if: always() && hashFiles('lint-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-node-${{ matrix.node-version }}
          path: lint-results.json

      - name: Comment on PR with lint results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Linting or TypeScript check failed. Please fix the errors and push again.'
            })
